<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2호선 혼잡도 예측</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:#f5f5f5;color:#1a1a1a}
  .wrap{max-width:640px;margin:0 auto;padding:2rem 1rem 4rem}
  .header{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem}
  .line2-badge{background:#00a84d;color:#fff;font-size:13px;font-weight:600;padding:4px 12px;border-radius:20px}
  .header h1{font-size:20px;font-weight:600}
  .card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
  .card-title{font-size:13px;color:#666;margin-bottom:12px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-group label{font-size:13px;color:#555}
  .form-group select,.form-group input{width:100%;padding:9px 10px;font-size:14px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;outline:none}
  .form-group select:focus,.form-group input:focus{border-color:#00a84d}
  .event-banner{display:none;border-radius:8px;padding:10px 14px;margin-top:12px;font-size:13px}
  .event-banner.active{display:block;background:#fff3e0;border:1px solid #ffcc80;color:#e65100}
  .submit-btn{width:100%;margin-top:14px;padding:11px;background:#00a84d;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
  .submit-btn:hover{background:#008f40}
  .submit-btn:disabled{background:#aaa;cursor:not-allowed}
  .loading{text-align:center;padding:2rem;color:#888;font-size:14px;display:none}
  .error-box{background:#ffebee;border:1px solid #ef9a9a;border-radius:8px;padding:10px 14px;font-size:13px;color:#c62828;margin-top:12px;display:none}
  .result-section{display:none}
  .event-result{display:none;border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-size:13px;background:#fff3e0;border:1px solid #ffcc80;color:#e65100}
  .advice-box{background:#f6f6f6;border-left:3px solid #00a84d;border-radius:0 8px 8px 0;padding:10px 14px;font-size:14px;margin-bottom:1rem}
  .stat-row{display:flex;gap:10px;margin-bottom:1rem}
  .stat-card{flex:1;background:#f6f6f6;border-radius:8px;padding:12px;text-align:center}
  .stat-val{font-size:22px;font-weight:600}
  .stat-lbl{font-size:12px;color:#888;margin-top:2px}
  .grade-pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:18px;font-weight:600}
  .car-section{border-radius:12px;padding:1.25rem;margin-bottom:1rem}
  .car-section.active{background:#e8f5e9;border:2px solid #00a84d}
  .car-section.inactive{background:#f6f6f6;border:1px solid #e0e0e0}
  .car-title{font-size:13px;font-weight:600;margin-bottom:10px}
  .car-section.active .car-title{color:#1b5e20}
  .car-section.inactive .car-title{color:#888}
  .car-msg{font-size:14px;line-height:1.5}
  .car-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .car-chip{background:#fff;border:2px solid #00a84d;border-radius:10px;padding:8px 14px;text-align:center}
  .car-chip-num{font-size:18px;font-weight:700;color:#00a84d}
  .car-chip-line{font-size:11px;color:#1b5e20;margin-top:2px}
  .time-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0f0f0}
  .time-row:last-child{border-bottom:none}
  .time-label{font-size:13px;font-weight:600;min-width:44px}
  .time-bar-wrap{flex:1;height:14px;background:#f0f0f0;border-radius:8px;overflow:hidden}
  .time-bar-fill{height:100%;border-radius:8px;transition:width 0.6s ease}
  .time-val{font-size:12px;color:#888;min-width:64px;text-align:right}
  .rec-badge{font-size:11px;background:#e8f5e9;color:#1b5e20;padding:2px 8px;border-radius:10px;white-space:nowrap;border:1px solid #a5d6a7;font-weight:600}
  .legend{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#888}
  .legend-dot{width:8px;height:8px;border-radius:50%}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <span class="line2-badge">2호선</span>
    <h1>혼잡도 예측</h1>
  </div>

  <div class="card">
    <div class="card-title">🚇 출발 정보 입력</div>
    <div class="form-grid">
      <div class="form-group"><label>출발역</label><select id="departure"></select></div>
      <div class="form-group"><label>도착역</label><select id="arrival"></select></div>
      <div class="form-group"><label>날짜</label><input type="date" id="date"></div>
      <div class="form-group"><label>출발 시간</label><select id="time"></select></div>
    </div>
    <div class="event-banner" id="event-banner"></div>
    <div class="error-box" id="error-box"></div>
    <button class="submit-btn" id="submit-btn" onclick="runPrediction()">🔍 혼잡도 예측하기</button>
  </div>

  <div class="loading" id="loading">⏳ 예측 중...</div>

  <div class="result-section" id="result">
    <div class="event-result" id="event-result"></div>
    <div class="advice-box" id="advice-box"></div>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-val" id="stat-congestion">—</div><div class="stat-lbl">혼잡도</div></div>
      <div class="stat-card"><div class="stat-val"><span class="grade-pill" id="stat-grade">—</span></div><div class="stat-lbl">혼잡 등급</div></div>
      <div class="stat-card"><div class="stat-val" id="stat-direction">—</div><div class="stat-lbl">운행 방향</div></div>
    </div>

    <div class="car-section" id="car-section">
      <div class="car-title" id="car-title">🚃 칸 추천</div>
      <div class="car-msg" id="car-msg"></div>
      <div class="car-chips" id="car-chips"></div>
    </div>

    <div class="card">
      <div class="card-title">🕐 시간대별 혼잡도 비교</div>
      <div id="time-compare"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#4caf50"></div>여유 ~33</div>
        <div class="legend-item"><div class="legend-dot" style="background:#8bc34a"></div>보통 ~50</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff9800"></div>혼잡 ~80</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f44336"></div>매우혼잡 ~130</div>
        <div class="legend-item"><div class="legend-dot" style="background:#b71c1c"></div>극혼잡 131+</div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:8000';

  // 역 목록은 서버 /stations 에서 받아오는 게 정석이지만,
  // 초기 렌더 속도를 위해 기본 목록을 넣고 로드 후 갱신
  let STATIONS = ["시청","을지로 입구","을지로 3가","을지로 4가","동대문역사문화공원","신당","상왕십리","왕십리","한양대","뚝섬","성수","건대입구","구의","강변","잠실나루","잠실","잠실새내","종합운동장","삼성","선릉","역삼","강남","교대","서초","방배","사당","낙성대","서울대입구","봉천","신림","신대방","구로디지털단지","대림","신도림","문래","영등포구청","당산","합정","홍대입구","신촌","이대","아현","충정로"];

  const dep = document.getElementById('departure');
  const arr = document.getElementById('arrival');

  function fillStations(){
    dep.innerHTML=''; arr.innerHTML='';
    STATIONS.forEach(s=>{dep.innerHTML+=`<option>${s}</option>`;arr.innerHTML+=`<option>${s}</option>`;});
    arr.value = STATIONS.includes('홍대입구') ? '홍대입구' : STATIONS[1];
  }
  fillStations();

  // 서버에서 실제 역 목록 받아와 갱신
  fetch(`${API_BASE}/stations`).then(r=>r.json()).then(d=>{
    if(d.stations && d.stations.length){STATIONS=d.stations;fillStations();}
  }).catch(()=>{});

  const dateEl = document.getElementById('date');
  const today = new Date();
  const maxD = new Date(today); maxD.setDate(today.getDate()+7);
  dateEl.min = today.toISOString().split('T')[0];
  dateEl.max = maxD.toISOString().split('T')[0];
  dateEl.value = today.toISOString().split('T')[0];
  dateEl.addEventListener('change', onDateChange);
  dep.addEventListener('change', onDateChange);

  const timeEl = document.getElementById('time');
  for(let h=5;h<25;h++){['00','30'].forEach(m=>{const hh=(h%24).toString().padStart(2,'0');timeEl.innerHTML+=`<option value="${hh}:${m}">${hh}:${m}</option>`;});}
  timeEl.value='18:00';
  timeEl.addEventListener('change', onDateChange);

  // 등급 → 색상/숫자
  function gradeColor(c){
    if(c<=33)return'#4caf50';
    if(c<=50)return'#8bc34a';
    if(c<=80)return'#ff9800';
    if(c<=130)return'#f44336';
    return'#b71c1c';
  }
  function gradeBg(grade){
    const map={'여유':'#e8f5e9;color:#1b5e20','보통':'#f1f8e9;color:#558b2f','혼잡':'#fff3e0;color:#e65100','매우 혼잡':'#ffebee;color:#c62828','극혼잡':'#b71c1c;color:#fff'};
    return map[grade]||'#eee;color:#333';
  }

  // 날짜/역/시간 변경 시 이벤트 미리 확인
  async function onDateChange(){
    const banner=document.getElementById('event-banner');
    banner.className='event-banner';
    try{
      const res=await fetch(`${API_BASE}/check_event`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({date:dateEl.value,station:dep.value,time:timeEl.value})
      });
      if(!res.ok)return;
      const ev=await res.json();
      if(ev.event_active && ev.events.length){
        banner.className='event-banner active';
        banner.textContent='📢 '+ev.events.map(e=>e.message).join(' / ');
      }
    }catch(e){console.warn('이벤트 조회 실패',e);}
  }

  async function runPrediction(){
    const errorBox=document.getElementById('error-box');
    errorBox.style.display='none';
    if(dep.value===arr.value){showError('출발역과 도착역이 같습니다.');return;}

    document.getElementById('loading').style.display='block';
    document.getElementById('result').style.display='none';
    document.getElementById('submit-btn').disabled=true;

    try{
      const res=await fetch(`${API_BASE}/recommend`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({departure:dep.value,arrival:arr.value,date:dateEl.value,time:timeEl.value})
      });
      if(!res.ok){const err=await res.json();throw new Error(err.detail||'예측 오류');}
      const data=await res.json();
      renderResult(data);
    }catch(e){showError(e.message);}
    finally{
      document.getElementById('loading').style.display='none';
      document.getElementById('submit-btn').disabled=false;
    }
  }

  function showError(msg){
    const box=document.getElementById('error-box');
    box.textContent='⚠️ '+msg;box.style.display='block';
    document.getElementById('loading').style.display='none';
    document.getElementById('submit-btn').disabled=false;
  }

  function renderResult(data){
    // 이벤트 결과 배너
    const er=document.getElementById('event-result');
    if(data.event && data.event.event_active && data.event.events.length){
      er.style.display='block';
      er.textContent='📢 '+data.event.events.map(e=>e.message).join(' / ');
    }else{er.style.display='none';}

    // 조언 (시간 추천 메시지)
    document.getElementById('advice-box').textContent='💡 '+data.time_recommendation.recommendation.message;

    // 통계
    document.getElementById('stat-congestion').textContent=data.congestion;
    const gradeEl=document.getElementById('stat-grade');
    gradeEl.textContent=data.grade;
    gradeEl.style.cssText='display:inline-block;padding:2px 10px;border-radius:20px;font-size:16px;font-weight:600;background:'+gradeBg(data.grade);
    document.getElementById('stat-direction').textContent=data.direction;

    // 칸 추천
    const carSec=document.getElementById('car-section');
    const carTitle=document.getElementById('car-title');
    const carMsg=document.getElementById('car-msg');
    const carChips=document.getElementById('car-chips');
    const car=data.car_recommendation;
    if(car.active){
      carSec.className='car-section active';
      carTitle.textContent='🚃 추천 탑승 칸';
      carMsg.textContent=car.message;
      carChips.innerHTML=(car.recommendations||[]).map(r=>
        `<div class="car-chip"><div class="car-chip-num">${r.car}번 칸</div><div class="car-chip-line">${r.transfer_line} · ${r.door}번 문</div></div>`
      ).join('');
    }else{
      carSec.className='car-section inactive';
      carTitle.textContent='🚃 칸 추천';
      carMsg.textContent=car.message;
      carChips.innerHTML='';
    }

    // 시간대 비교
    const slots=data.time_recommendation.slots;
    const bestMin=data.time_recommendation.recommendation.minute;
    const maxV=Math.max(...slots.map(s=>s.congestion));
    const tc=document.getElementById('time-compare');
    tc.innerHTML='';
    slots.forEach(s=>{
      const pct=maxV>0?Math.round(s.congestion/maxV*100):0;
      const isRec=s.minute===bestMin;
      const row=document.createElement('div');
      row.className='time-row';
      row.innerHTML=`
        <span class="time-label">${s.time}</span>
        <div class="time-bar-wrap"><div class="time-bar-fill" style="width:${pct}%;background:${gradeColor(s.congestion)}"></div></div>
        <span class="time-val">${s.congestion} · ${s.grade}</span>
        ${isRec?'<span class="rec-badge">⭐ 추천</span>':''}`;
      tc.appendChild(row);
    });

    document.getElementById('result').style.display='block';
    document.getElementById('result').scrollIntoView({behavior:'smooth'});
  }

  // 초기 이벤트 확인
  onDateChange();
</script>
</body>
</html>
